[package]
name = "proxy"
description = "version.dll stand-in. Forwards the 17 version.dll exports to System32 and starts the core loader thread only when a launch token exists."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

# The game loads the proxy as version.dll. `DLL_NAME` in forwarders.rs names the same DLL, and a unit
# test checks that the two agree.
[lib]
name = "version"
# Cargo builds a cdylib-only library for no test target. With the rlib, Cargo builds the library for
# tests/exports.rs, which rebuilds the version.dll the unit tests load. A `--lib` run does not.
crate-type = ["cdylib", "rlib"]

[dependencies]
ipc-layout = { path = "../ipc-layout" }
thiserror.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
]

[dev-dependencies.windows]
workspace = true
features = [
    "Wdk_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_System_SystemInformation",
]

[lints]
workspace = true
