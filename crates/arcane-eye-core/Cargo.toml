[package]
name = "arcane-eye-core"
description = "The core DLL the proxy loads. Owns the init sequence and wires the subsystems together."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
arc-swap.workspace = true
diag = { path = "../diag" }
game-bindings = { path = "../game-bindings" }
game-mem = { path = "../game-mem" }
gfx = { path = "../gfx" }
hooks = { path = "../hooks" }
ipc-layout = { path = "../ipc-layout" }
settings = { path = "../settings" }
stereo-core = { path = "../stereo-core" }
thiserror.workspace = true
tracing.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
test-support = { path = "../test-support" }
viewer-client = { path = "../viewer-client" }

[dev-dependencies.windows]
workspace = true
features = ["Win32_Graphics_Direct3D"]

[lints]
workspace = true
