[package]
name = "viewer"
description = "Development viewer for the per-eye images in the shared debug texture."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
ipc-layout = { path = "../ipc-layout" }
viewer-client = { path = "../viewer-client" }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
viewer-client = { path = "../viewer-client", features = ["fixture"] }

[lints]
workspace = true
