[package]
name = "launch"
description = "Starts and stops the game with a launch token: the Steam start, the direct start, the status wait and the window close."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
ipc-layout = { path = "../ipc-layout" }
thiserror.workspace = true
tracing.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies.windows]
workspace = true
features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader"]

[lints]
workspace = true
