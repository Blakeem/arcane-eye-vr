[package]
name = "launch"
description = "Starts and stops the game with a launch token: the Steam start, the direct start, the status wait, the window close, the settings reload request, a desktop of its own, the cursor position, the game's mouse input and the copy of a window from the screen."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
ipc-layout = { path = "../ipc-layout" }
thiserror.workspace = true
tracing.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
test-support = { path = "../test-support" }

[dev-dependencies.windows]
workspace = true
features = ["Win32_Graphics_Dwm", "Win32_System_LibraryLoader"]

[lints]
workspace = true
