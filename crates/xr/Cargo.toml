[package]
name = "xr"
description = "The OpenXR session: the runtime load, the frame loop, the swapchains, the quad layers and the controllers' input through device profiles. No game type."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
device-profile = { path = "../device-profile" }
openxr.workspace = true
serde.workspace = true
serde_json.workspace = true
stereo-core = { path = "../stereo-core" }
thiserror.workspace = true
tracing.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
]

[dev-dependencies]
test-support = { path = "../test-support" }

[lints]
workspace = true
