[package]
name = "launcher"
description = "The VR launch app. Writes the launch token and starts the game through Steam."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

# The player adds this exe to Steam, so its name is the product's, not the crate's.
[[bin]]
name = "arcane-eye-vr"
path = "src/main.rs"

[dependencies]
diag = { path = "../diag" }
ipc-layout = { path = "../ipc-layout" }
thiserror.workspace = true
tracing.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
