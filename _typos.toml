[files]
extend-exclude = ["target", "crates/shim/vendor", "reference", "scratch"]

[default]
# Git commit hashes.
extend-ignore-re = ['\b[0-9a-f]{7,40}\b']

[default.extend-identifiers]
VRto3D = "VRto3D"
PNGs = "PNGs"

# Domain terms: Luke Ross's frame interpolation, Unreal Engine, structured exception handling,
# AMD GPU Services, level of detail, and the DXC and FXC flags Fo and Ges.
[default.extend-words]
AER = "AER"
UE = "UE"
SEH = "SEH"
seh = "seh"
AGS = "AGS"
ags = "ags"
LOD = "LOD"
Fo = "Fo"
Ges = "Ges"
