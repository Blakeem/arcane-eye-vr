# Verified with cargo-deny 0.20.2.
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = []

[licenses]
version = 2
# The mod releases as open source, so every dependency license must allow redistribution.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "lazy_static", reason = "global state lives in game-bindings/src/state only" },
    # tracing-core uses once_cell internally. First-party crates may not depend on it.
    { crate = "once_cell", wrappers = ["tracing-core"], reason = "global state lives in game-bindings/src/state only" },
    # anyhow is for the init layer and the binaries only. Hook and library code returns typed errors.
    { crate = "anyhow", wrappers = ["arcane-eye-core", "crashd", "launcher", "sigcheck", "viewer"], reason = "hook code returns typed errors that name the failure" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
