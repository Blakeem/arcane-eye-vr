version = 1
name = "Steam Frame controller"
interaction_profile = "/interaction_profiles/valve/frame_controller_valve"
extension = "XR_VALVE_frame_controller_interaction"

[left]
aim = "/user/hand/left/input/aim/pose"
grip = "/user/hand/left/input/grip/pose"
menu = "/user/hand/left/input/view/click"
select = "/user/hand/left/input/trigger/value"
secondary = "/user/hand/left/input/squeeze/click"
scroll = "/user/hand/left/input/thumbstick"
haptic = "/user/hand/left/output/haptic"

[right]
aim = "/user/hand/right/input/aim/pose"
grip = "/user/hand/right/input/grip/pose"
menu = "/user/hand/right/input/menu/click"
select = "/user/hand/right/input/trigger/value"
secondary = "/user/hand/right/input/squeeze/click"
scroll = "/user/hand/right/input/thumbstick"
haptic = "/user/hand/right/output/haptic"
